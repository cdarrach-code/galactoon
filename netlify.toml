[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Enable developer comparison UI on the hosted site (admin still gated).
  DEV_COMPARISON_MODE = "true"

# Allow larger selfie uploads (default body limits are too small for phone cameras).
[functions."___netlify-server-handler"]
  timeout = 60

# Bundle style assets + admin defaults into serverless functions so
# classic-2d-master.png is available at runtime on Netlify.
[functions]
  included_files = [
    "assets/style-references/**",
    "public/style-references/**",
    "data/admin-config.json"
  ]

# Next.js is auto-detected; OpenNext adapter is applied by Netlify.
# Set OPENAI_API_KEY in the Netlify UI (Site settings → Environment variables)
# for live image generation. Without it, the app runs in mock preview mode.
